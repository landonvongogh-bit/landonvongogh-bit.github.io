<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlipTracker SYNC - Full</title>
<script src="https://accounts.google.com/gsi/client" async></script>
<script src="https://apis.google.com/js/api.js" async></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>*{font-family:Inter,sans-serif}.mono{font-family:'JetBrains Mono',monospace}body{background:#09090b;color:#fafafa}::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#27272a;border-radius:99px}</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import React, {useState, useEffect, useMemo} from "https://esm.sh/react@18.3.1";
import ReactDOM from "https://esm.sh/react-dom@18.3.1/client";

const CLIENT_ID = "418519359458-n3t0tsul2j3ijgobrhuee1mvd2qn5qoj.apps.googleusercontent.com";
const SCOPES = "https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.appdata";
const FOLDER_NAME = "FlipTracker";
const FILE_NAME = "fliptracker_data.json";

let tokenClient, accessToken = localStorage.getItem('ft_token') || null, gapiInited=false, gisInited=false;
function initGapi(){ gapi.load('client', async()=>{ await gapi.client.init({discoveryDocs:['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest']}); gapiInited=true; }); }
function initGis(){ tokenClient = google.accounts.oauth2.initTokenClient({ client_id: CLIENT_ID, scope: SCOPES, callback:(resp)=>{ if(resp.error) return; accessToken=resp.access_token; localStorage.setItem('ft_token',accessToken); window.dispatchEvent(new Event('ft-auth')); }}); gisInited=true; }
window.onload = ()=>{ initGapi(); initGis(); };

async function ensureFolder(){
  const q = `mimeType='application/vnd.google-apps.folder' and name='${FOLDER_NAME}' and trashed=false`;
  const r = await gapi.client.drive.files.list({q, fields:'files(id)'});
  if(r.result.files.length) return r.result.files[0].id;
  const c = await gapi.client.drive.files.create({resource:{name:FOLDER_NAME, mimeType:'application/vnd.google-apps.folder'}, fields:'id'});
  return c.result.id;
}
async function driveSave(data){
  const folderId = await ensureFolder();
  const q = `'${folderId}' in parents and name='${FILE_NAME}' and trashed=false`;
  const list = await gapi.client.drive.files.list({q, fields:'files(id)'});
  const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
  const meta = {name:FILE_NAME, parents:[folderId]};
  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify(meta)], {type:'application/json'}));
  form.append('file', blob);
  if(list.result.files.length){
    await fetch(`https://www.googleapis.com/upload/drive/v3/files/${list.result.files[0].id}?uploadType=multipart`,{method:'PATCH', headers:{Authorization:`Bearer ${accessToken}`}, body:form});
  } else {
    await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST', headers:{Authorization:`Bearer ${accessToken}`}, body:form});
  }
}
async function driveLoad(){
  const folderId = await ensureFolder();
  const q = `'${folderId}' in parents and name='${FILE_NAME}' and trashed=false`;
  const list = await gapi.client.drive.files.list({q, fields:'files(id)'});
  if(!list.result.files.length) return null;
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${list.result.files[0].id}?alt=media`,{headers:{Authorization:`Bearer ${accessToken}`}});
  return await res.json();
}

function App(){
  const [connected, setConnected] = useState(!!accessToken);
  const [items, setItems] = useState(()=>{ try{return JSON.parse(localStorage.getItem('ft_items')||'[]')}catch{return []} });
  const [filter, setFilter] = useState('all');
  const [syncing, setSyncing] = useState(false);
  const [showAdd, setShowAdd] = useState(false);
  const [form, setForm] = useState({name:'', buy: '', sell:'', fees:'', ship:'', status:'inventory', category:'general', notes:''});

  useEffect(()=>{ const h=()=>setConnected(!!localStorage.getItem('ft_token')); window.addEventListener('ft-auth',h); return ()=>window.removeEventListener('ft-auth',h); },[]);
  useEffect(()=>{ localStorage.setItem('ft_items', JSON.stringify(items)); }, [items]);

  const stats = useMemo(()=>{
    const inv = items.filter(i=>i.status!=='sold');
    const sold = items.filter(i=>i.status==='sold');
    const totalBuy = items.reduce((s,i)=>s+(parseFloat(i.buy)||0),0);
    const totalSell = sold.reduce((s,i)=>s+(parseFloat(i.sell)||0),0);
    const totalFees = sold.reduce((s,i)=>s+(parseFloat(i.fees)||0)+(parseFloat(i.ship)||0),0);
    const profit = totalSell - sold.reduce((s,i)=>s+(parseFloat(i.buy)||0),0) - totalFees;
    const invVal = inv.reduce((s,i)=>s+(parseFloat(i.buy)||0),0);
    return {count:items.length, inv:inv.length, sold:sold.length, profit, invVal, totalSell};
  },[items]);

  const connect = ()=>{ if(!tokenClient) return alert('Google loading, wait 2 sec'); tokenClient.requestAccessToken(); };
  const save = async()=>{ if(!accessToken) return connect(); setSyncing(true); try{ await driveSave({items, updated:new Date().toISOString()}); alert('✅ Saved to Drive / FlipTracker folder'); }catch(e){ alert('Save failed: '+e.message);} setSyncing(false); };
  const load = async()=>{ if(!accessToken) return connect(); setSyncing(true); try{ const d=await driveLoad(); if(d?.items){ setItems(d.items); alert(`✅ Loaded ${d.items.length} items from Drive`);} else alert('No backup found yet in Drive - click Save to create one'); }catch(e){ alert('Load failed: '+e.message);} setSyncing(false); };

  const addItem = ()=>{
    if(!form.name || !form.buy) return alert('Name + Buy price required');
    const newItem = {id:Date.now().toString(), name:form.name, buy:parseFloat(form.buy)||0, sell:parseFloat(form.sell)||0, fees:parseFloat(form.fees)||0, ship:parseFloat(form.ship)||0, status:form.status, category:form.category, notes:form.notes, date:new Date().toISOString()};
    setItems([newItem, ...items]); setForm({name:'',buy:'',sell:'',fees:'',ship:'',status:'inventory',category:'general',notes:''}); setShowAdd(false);
  };
  const deleteItem = (id)=>{ if(confirm('Delete this item?')) setItems(items.filter(i=>i.id!==id)); };
  const toggleSold = (id)=> setItems(items.map(i=> i.id===id ? {...i, status: i.status==='sold'?'inventory':'sold'} : i));

  const filtered = items.filter(i=>{
    if(filter==='all') return true;
    if(filter==='inventory') return i.status!=='sold';
    if(filter==='sold') return i.status==='sold';
    return true;
  });

  return React.createElement('div', {className:'min-h-screen max-w-6xl mx-auto p-4 md:p-8'},
    React.createElement('header', {className:'flex flex-wrap justify-between items-center gap-4 border-b border-zinc-800 pb-6 mb-6'},
      React.createElement('div', null,
        React.createElement('h1', {className:'text-3xl font-bold tracking-tight flex items-center gap-3'}, 'FlipTracker ', React.createElement('span', {className:'text-emerald-400 text-sm font-mono border border-emerald-900 bg-emerald-950/40 px-2 py-0.5 rounded-full'}, 'SYNC')),
        React.createElement('p', {className:'text-zinc-500 text-xs mono mt-1'}, CLIENT_ID.slice(0,38)+'... ✅ FIXED • Connected to Drive')
      ),
      React.createElement('div', {className:'flex items-center gap-2'},
        !connected ? React.createElement('button', {onClick:connect, className:'bg-white text-black px-4 py-2 rounded-xl text-sm font-semibold'}, 'Connect Drive')
        : React.createElement(React.Fragment, null,
            React.createElement('div', {className:'text-emerald-400 text-xs px-3 py-2 bg-emerald-950/30 border border-emerald-900 rounded-xl'}, '● Connected'),
            React.createElement('button', {onClick:save, disabled:syncing, className:'bg-zinc-800 hover:bg-zinc-700 px-4 py-2 rounded-xl text-sm font-medium'}, syncing?'Saving...':'Save to Drive'),
            React.createElement('button', {onClick:load, className:'bg-zinc-800 hover:bg-zinc-700 px-4 py-2 rounded-xl text-sm'}, 'Load'),
            React.createElement('button', {onClick:()=>{localStorage.removeItem('ft_token'); accessToken=null; setConnected(false);}, className:'text-zinc-500 text-xs px-2'}, 'Disconnect')
          ),
        React.createElement('button', {onClick:()=>setShowAdd(!showAdd), className:'bg-white text-black px-5 py-2.5 rounded-xl text-sm font-bold ml-2'}, showAdd?'Cancel':'+ Add Flip')
      )
    ),

    React.createElement('div', {className:'grid grid-cols-2 md:grid-cols-4 gap-3 mb-6'},
      React.createElement('div', {className:'bg-zinc-900 border border-zinc-800 rounded-2xl p-4'}, React.createElement('div', {className:'text-[11px] uppercase tracking-widest text-zinc-500'}, 'Total Profit'), React.createElement('div', {className:'text-2xl font-bold mt-1 '+(stats.profit>=0?'text-emerald-400':'text-red-400')}, `$${stats.profit.toFixed(2)}`)),
      React.createElement('div', {className:'bg-zinc-900 border border-zinc-800 rounded-2xl p-4'}, React.createElement('div', {className:'text-[11px] uppercase tracking-widest text-zinc-500'}, 'Items Sold'), React.createElement('div', {className:'text-2xl font-bold mt-1'}, stats.sold), React.createElement('div', {className:'text-xs text-zinc-500'}, `${stats.count} total`)),
      React.createElement('div', {className:'bg-zinc-900 border border-zinc-800 rounded-2xl p-4'}, React.createElement('div', {className:'text-[11px] uppercase tracking-widest text-zinc-500'}, 'Inventory Value'), React.createElement('div', {className:'text-2xl font-bold mt-1'}, `$${stats.invVal.toFixed(2)}`), React.createElement('div', {className:'text-xs text-zinc-500'}, `${stats.inv} items`)),
      React.createElement('div', {className:'bg-zinc-900 border border-zinc-800 rounded-2xl p-4'}, React.createElement('div', {className:'text-[11px] uppercase tracking-widest text-zinc-500'}, 'Total Sales'), React.createElement('div', {className:'text-2xl font-bold mt-1'}, `$${stats.totalSell.toFixed(2)}`))
    ),

    showAdd && React.createElement('div', {className:'bg-zinc-900 border border-zinc-800 rounded-2xl p-6 mb-6'},
      React.createElement('h3', {className:'font-semibold mb-4'}, 'Add New Flip'),
      React.createElement('div', {className:'grid md:grid-cols-2 gap-4'},
        React.createElement('input', {placeholder:'Item Name (e.g. Nike Dunks Size 10)', value:form.name, onChange:e=>setForm({...form,name:e.target.value}), className:'bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 text-sm w-full'}),
        React.createElement('select', {value:form.status, onChange:e=>setForm({...form,status:e.target.value}), className:'bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 text-sm w-full'}, React.createElement('option', {value:'inventory'}, 'In Inventory'), React.createElement('option', {value:'sold'}, 'Sold'), React.createElement('option', {value:'listed'}, 'Listed')),
        React.createElement('input', {placeholder:'Buy Price', type:'number', value:form.buy, onChange:e=>setForm({...form,buy:e.target.value}), className:'bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 text-sm'}),
        React.createElement('input', {placeholder:'Sell Price (if sold)', type:'number', value:form.sell, onChange:e=>setForm({...form,sell:e.target.value}), className:'bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 text-sm'}),
        React.createElement('input', {placeholder:'Fees (eBay, StockX, etc)', type:'number', value:form.fees, onChange:e=>setForm({...form,fees:e.target.value}), className:'bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 text-sm'}),
        React.createElement('input', {placeholder:'Shipping Cost', type:'number', value:form.ship, onChange:e=>setForm({...form,ship:e.target.value}), className:'bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 text-sm'}),
        React.createElement('input', {placeholder:'Category / Notes', value:form.notes, onChange:e=>setForm({...form,notes:e.target.value}), className:'bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 text-sm md:col-span-2'})
      ),
      React.createElement('button', {onClick:addItem, className:'mt-4 w-full bg-white text-black py-3 rounded-xl font-bold'}, 'Add to Tracker')
    ),

    React.createElement('div', {className:'flex gap-2 mb-4'},
      ['all','inventory','sold'].map(f=> React.createElement('button', {key:f, onClick:()=>setFilter(f), className:`px-4 py-2 rounded-full text-xs font-medium capitalize border ${filter===f?'bg-white text-black border-white':'bg-zinc-900 border-zinc-800 text-zinc-400 hover:bg-zinc-800'}`}, f))
    ),

    filtered.length===0 ? React.createElement('div', {className:'text-center py-20 border border-dashed border-zinc-800 rounded-2xl'},
      React.createElement('p', {className:'text-zinc-500'}, 'No flips yet. Click "+ Add Flip" to start tracking.'),
      React.createElement('p', {className:'text-zinc-600 text-xs mt-2'}, 'Your data auto-saves locally and syncs to Google Drive')
    ) : React.createElement('div', {className:'grid gap-3'},
      filtered.map(item=>{
        const profit = (parseFloat(item.sell)||0) - (parseFloat(item.buy)||0) - (parseFloat(item.fees)||0) - (parseFloat(item.ship)||0);
        const isSold = item.status==='sold';
        return React.createElement('div', {key:item.id, className:`bg-zinc-900 border rounded-2xl p-4 flex justify-between items-center ${isSold?'border-emerald-900/50':'border-zinc-800'}`},
          React.createElement('div', {className:'flex-1'},
            React.createElement('div', {className:'flex items-center gap-2'}, React.createElement('span', {className:'font-medium'}, item.name), isSold && React.createElement('span', {className:'text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-900 px-2 py-0.5 rounded-full'}, 'SOLD')),
            React.createElement('div', {className:'text-xs text-zinc-500 mt-1 mono'}, `Buy $${item.buy} → Sell $${item.sell||0} | Fees $${item.fees||0} + Ship $${item.ship||0} = `, React.createElement('span', {className:isSold?(profit>=0?'text-emerald-400':'text-red-400'):'text-zinc-300'}, isSold?`Profit $${profit.toFixed(2)}`:'In Inventory')),
          React.createElement('div', {className:'flex gap-1 ml-4'},
            React.createElement('button', {onClick:()=>toggleSold(item.id), className:'bg-zinc-800 hover:bg-zinc-700 px-3 py-1.5 rounded-lg text-xs'}, isSold?'Mark Inventory':'Mark Sold'),
            React.createElement('button', {onClick:()=>deleteItem(item.id), className:'text-zinc-600 hover:text-red-400 px-2 text-xs'}, '✕')
          )
        );
      })
    ),
    React.createElement('div', {className:'text-center text-[11px] text-zinc-600 mt-12'}, 'FlipTracker SYNC • Client ID Fixed • Auto-syncs to Google Drive folder "FlipTracker"')
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
